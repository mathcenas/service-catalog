name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.30.4

      # Publica TODAS las funciones del repo (un cambio en _shared/ afecta a varias).
      # Las que se llaman sin sesión (scripts, webhooks, links públicos) van sin verificación de JWT:
      # mantener esta lista igual a lo que está en producción.
      - name: Deploy Edge Functions
        run: |
          NO_JWT=" ingest-events track-open get-acl-review resend-webhook ingest-heartbeat submit-acl-review r sync-script-versions submit-support-request ingest-kopia-webhook ingest-vm-event portal-error "
          failed=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            [ -f "$dir/index.ts" ] || continue
            flag=""
            case "$NO_JWT" in *" $name "*) flag="--no-verify-jwt" ;; esac
            echo "::group::$name $flag"
            supabase functions deploy "$name" $flag --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" || failed="$failed $name"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Fallaron:$failed"; exit 1; fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
