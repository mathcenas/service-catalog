services:
  client-manager:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: client-manager:latest
    container_name: client-manager
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "${APP_PORT:-3020}:80"
    volumes:
      - /srv/service-catalog/email-audit:/usr/share/nginx/html/uploads:ro
    networks:
      - npm_default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  upload-service:
    build:
      context: ./services/upload-service
    image: upload-service:latest
    container_name: upload-service
    restart: unless-stopped
    expose:
      - "3030"
    environment:
      - UPLOAD_DIR=/uploads
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    volumes:
      - /srv/service-catalog/email-audit:/uploads
    networks:
      - npm_default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  npm_default:
    external: true
    name: ${NPM_NETWORK:-npm_default}
